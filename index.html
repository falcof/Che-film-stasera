if (act === 'freset') { CFG = { minRating: CFG_DEFAULT.minRating, yearsBack: CFG_DEFAULT.yearsBack, providers: [] }; saveCfg(); return renderFilters(); }
if (act === 'prov') {
const v = el.dataset.v, i = CFG.providers.indexOf(v);
if (i === -1) CFG.providers.push(v); else CFG.providers.splice(i, 1);
el.setAttribute('aria-pressed', i === -1); saveCfg();
$('fsum').textContent = filtersSummary();
return;
}
if (act === 'another') { if (!S.queue.length) { buildQueue(); if (S.empty) return render(); } return showNext(S.mode === 'surprise'); }
if (act === 'opt') {
const step = steps()[S.step]; const v = el.dataset.v;
S.ans[step.key] = v === '' ? null : (step.key === 'co' || step.key === 'mood' ? v : (parseInt(v, 10) || null));
S.step = Math.min(S.step + 1, steps().length - 1);
return render();
}
if (act === 'genre') {
const g = el.dataset.v, i = S.ans.genres.indexOf(g);
if (i === -1) S.ans.genres.push(g); else S.ans.genres.splice(i, 1);
el.setAttribute('aria-pressed', i === -1);
return;
}
if (act === 'back') { S.step = Math.max(0, S.step - 1); return render(); }
if (act === 'find') { if (S.loading) return; const kd = S.kind; await ensurePool(); if (S.ans.mood === 'cervellotico') await ensureCv(); if (kd !== S.kind) return render(); buildQueue(); if (S.empty) { render(); return; } return showNext(false); }
if (act === 'edit') { S.cur = null; S.done = false; S.empty = false; S.step = 0; return render(); }
if (act === 'watch' && S.cur) {
if (inList(WATCH, S.cur.id)) { WATCH = WATCH.filter(x => x.id !== S.cur.id); toast('Tolto dalla lista'); }
else { addTo(WATCH, S.cur); toast('Aggiunto a "Da vedere"'); }
store.set('cfs_watch', WATCH); return render();
}
if (act === 'seen' && S.cur) {
const tv = S.cur.kind === 'tv';
if (inList(SEEN, S.cur.id)) {
SEEN = SEEN.filter(x => x.id !== S.cur.id); store.set('cfs_seen', SEEN);
toast(tv ? 'Tolta dai già visti' : 'Tolto dai già visti');
} else {
addTo(SEEN, S.cur); store.set('cfs_seen', SEEN);
WATCH = WATCH.filter(x => x.id !== S.cur.id); store.set('cfs_watch', WATCH);
toast(tv ? 'Segnata come vista' : 'Segnato come visto');
}
return render();
}
if (act === 'share' && S.cur) {
const txt = Engine.shareText(S.cur);
try { await navigator.clipboard.writeText(txt); toast('Testo copiato'); }
catch (err) {
const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
document.body.appendChild(ta); ta.select();
let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
ta.remove(); toast(ok ? 'Testo copiato' : 'Copia non riuscita: seleziona il titolo e condividilo a mano');
}
return;
}
if (act === 'rm') {
const id = el.dataset.id;
if (el.dataset.kind === 'watch') { WATCH = WATCH.filter(x => x.id !== id); store.set('cfs_watch', WATCH); }
else { SEEN = SEEN.filter(x => x.id !== id); store.set('cfs_seen', SEEN); S.empty = false; }
return render();
}
});
function readSlider(el, commit) {
const v = parseFloat(el.value);
if (el.dataset.f === 'minRating') { CFG.minRating = Math.round(v * 10) / 10; $('o-rate').textContent = fmtVote(CFG.minRating); }
else { CFG.yearsBack = Math.round(v); $('o-years').textContent = CFG.yearsBack + (CFG.yearsBack === 1 ? ' anno' : ' anni'); }
$('fsum').textContent = filtersSummary();
if (commit) saveCfg();
}
const SRCH = { n: { movie: 0, tv: 0 }, timer: null, by: { movie: { q: '', res: [], note: '' }, tv: { q: '', res: [], note: '' } } };
function syncSearch() {
const tv = isTv(), st = SRCH.by[S.kind];
const sum = $('search').querySelector('summary');
sum.firstChild.textContent = tv ? 'Cerca una serie TV' : 'Cerca un film';
sum.querySelector('.n').textContent = tv ? 'solo serie' : 'solo film';
const q = $('q');
q.placeholder = tv ? 'Es. Dark, Breaking Bad, The Bear…' : 'Es. Inception, Parasite, Dune…';
q.setAttribute('aria-label', tv ? 'Cerca una serie TV' : 'Cerca un film');
if (q.value !== st.q) q.value = st.q;
renderSearch();
}
function renderSearch() {
const st = SRCH.by[S.kind];
$('snote').textContent = st.note;
$('sres').innerHTML = st.res.map((f, i) => {
const w = inList(WATCH, f.id), sn = inList(SEEN, f.id), tv = f.kind === 'tv';
return '<div class="li sr"><span class="t"><button class="tl" data-act="open" data-i="' + i + '" aria-label="Apri la scheda: ' + esc(f.t) + '">' + esc(f.t) + '</button>' + (f.y ? ' <small>(' + f.y + ')</small>' : '') + (f.r ? ' <small>★ ' + fmtVote(f.r) + '</small>' : '') + '</span>' +
'<span class="chips sm"><button class="chip" data-act="sw" data-i="' + i + '" aria-pressed="' + w + '">' + (w ? 'Nella lista' : 'Da vedere') + '</button>' +
'<button class="chip" data-act="ss" data-i="' + i + '" aria-pressed="' + sn + '">' + (sn ? (tv ? 'Vista' : 'Visto') : (tv ? 'Già vista' : 'Già visto')) + '</button></span></div>';
}).join('');
}
async function doSearch(query, kind) {
const my = ++SRCH.n[kind];
const st = SRCH.by[kind];
const qy = query.trim();
const show = () => { if (S.kind === kind) renderSearch(); };
if (qy.length < 2) { st.res = []; st.note = qy ? 'Scrivi almeno 2 lettere.' : ''; show(); return; }
st.note = 'Cerco…'; show();
let res = null, live = false;
if (TMDB_KEY && isLive(kind)) {
const ctl = new AbortController();
const timer = setTimeout(() => ctl.abort(), 6000);
try { res = await Engine.searchLive((u) => fetch(u, { signal: ctl.signal }), TMDB_KEY, qy, kind); live = true; } catch (e) { res = null; }
clearTimeout(timer);
}
if (my !== SRCH.n[kind]) return;
const tv = kind === 'tv';
if (!res) res = Engine.searchLocal(qy, kind);
const small = 'catalogo incorporato (' + (tv ? Engine.CATALOG_TV.length + Engine.CULT_TV.length + ' serie' : Engine.CATALOG.length + Engine.CULT_MOVIES.length + ' film') + ')';
st.res = res;
st.note = res.length
? (live ? res.length + ' risultati da TMDB.' : 'Cerco nel ' + small + ': con i dati live si cerca su tutto TMDB.')
: 'Nessun risultato per "' + qy + '".' + (live ? '' : ' Cerco solo nel ' + small + ': con i dati live si cerca su tutto TMDB.');
show();
}
async function openResult(i) {
const kd = S.kind, f = SRCH.by[kd].res[i];
if (!f || S.busy) return;
S.busy = true;
try { if (SRC[kd] === 'tmdb' && f.tmdb) await Engine.hydrate(f, (u) => fetch(u), TMDB_KEY); } finally { S.busy = false; }
if (kd !== S.kind) return;
S.cur = f; S.done = false; S.empty = false; S.reasons = []; S.relaxed = [];
render();
try { $('stage').scrollIntoView({ block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth' }); } catch (e3) {  }
focusResult();
}
function searchToggle(kind, i) {
const f = SRCH.by[S.kind].res[i];
if (!f) return;
const tv = f.kind === 'tv';
if (kind === 'watch') {
if (inList(WATCH, f.id)) { WATCH = WATCH.filter(x => x.id !== f.id); toast('Tolto dalla lista'); }
else { addTo(WATCH, f); toast('Aggiunto a "Da vedere"'); }
store.set('cfs_watch', WATCH);
} else if (inList(SEEN, f.id)) {
SEEN = SEEN.filter(x => x.id !== f.id); store.set('cfs_seen', SEEN); toast(tv ? 'Tolta dai già visti' : 'Tolto dai già visti');
} else {
addTo(SEEN, f); store.set('cfs_seen', SEEN);
WATCH = WATCH.filter(x => x.id !== f.id); store.set('cfs_watch', WATCH);
toast(tv ? 'Segnata come vista' : 'Segnato come visto');
}
renderSearch(); renderLists();
if (S.cur && S.cur.id === f.id) render();
}
document.addEventListener('input', (e) => {
if (e.target.id === 'q') { clearTimeout(SRCH.timer); const v = e.target.value, k = S.kind; SRCH.by[k].q = v; SRCH.timer = setTimeout(() => doSearch(v, k), 350); return; }
if (e.target.dataset && e.target.dataset.f) readSlider(e.target, false);
});
document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.f) readSlider(e.target, true); });
render();
renderFilters();
syncSearch();
['movie', 'tv'].forEach(async function (kind) {
if (!TMDB_KEY) return;
const ctl = new AbortController();
const timer = setTimeout(() => ctl.abort(), 8000);
const f = (u) => fetch(u, { signal: ctl.signal });
try {
let prov = [];
try { prov = await Engine.loadProviders(f, TMDB_KEY, kind); } catch (e) {  }
PROV[kind] = prov;
const ids = providerIds(kind);
const p = await Engine.loadLive(f, TMDB_KEY, new Date(), kind, liveOpts(ids));
if (p.length >= (ids.length ? 1 : 30)) {
POOLS[kind] = p; SRC[kind] = 'tmdb'; LIVE_KEY[kind] = liveKey(kind, ids);
if (S.kind === kind) {
renderFilters();
if (!S.busy && !S.loading && !S.cur && !S.queue.length && S.step === 0) render(); else renderFoot();
}
}
} catch (e) {  }
clearTimeout(timer);
});
})();
