<style>
/* Layout stile "streaming": barra in alto con Film / Serie TV, filtri a pillola, un grande "hero"
   per il titolo in evidenza, poi righe orizzontali scorrevoli (altre proposte, liste personali).
   Solo tema scuro, come le app di streaming. */
:root {
  --bg: #141414;
  --surface: #1F1F1F;
  --surface-2: #2B2B2B;
  --line: #3D3D3D;
  --fg: #F5F5F5;
  --muted: #B3B3B3;
  --accent: #F4B63F;
  --accent-fg: #1B1300;
  --accent-text: #F4B63F;
  --good: #52D6C0;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, a { font: inherit; }
button, a.btn, .chip, .tab, .card { touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.app { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* header: marchio, Film / Serie TV, origine dei dati */
.top { position: sticky; top: 0; z-index: 12; display: flex; align-items: center; gap: 28px; padding: 14px 0 10px; background: linear-gradient(var(--bg) 72%, transparent); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; color: var(--accent); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 30px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; color: var(--accent); }
.src { margin-left: auto; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--surface); white-space: nowrap; }
.src b { color: var(--good); font-weight: 600; }

/* Film / Serie TV: testo con sottolineatura in alto (desktop), barra in basso a portata di pollice (telefono) */
.kind { display: flex; gap: 22px; }
.kind button { border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 16px; cursor: pointer; min-height: 44px; padding: 0 2px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-bottom: 3px solid transparent; }
.kind button svg { display: none; }
.kind button:hover { color: var(--fg); }
.kind button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--accent); }

/* modalità: pillole */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 9px 18px; font-size: 15px; line-height: 1.2; border-radius: 999px; font-weight: 600; cursor: pointer; min-height: 44px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tab:not([aria-selected="true"]):hover { background: var(--surface-2); }

/* stage */
.stage { min-height: 340px; }
.panel { background: var(--surface); border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
.lead { font-family: var(--font-display); font-weight: 900; font-size: clamp(32px, 6vw, 52px); line-height: 1; text-transform: uppercase; margin: 0; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 52ch; }
.btn { border: 0; background: rgb(109 109 110 / .55); color: #fff; border-radius: 8px; padding: 11px 18px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; }
.btn:hover { background: rgb(109 109 110 / .8); }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.big { font-size: 18px; min-height: 58px; padding: 14px 28px; align-self: flex-start; }
.btn[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--good); color: var(--good); }
.btn[disabled] { opacity: .6; cursor: default; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 8px 4px; align-self: flex-start; }
.link:hover { color: var(--fg); }

/* guide */
.prog { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.prog .bar { flex: 1; height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; max-width: 220px; }
.prog .bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 999px; padding: 11px 18px; cursor: pointer; font-weight: 500; min-height: 46px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.chip.ghost { background: transparent; color: var(--muted); border-style: dashed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* hero: il titolo in evidenza */
.hero { --h: 220; position: relative; isolation: isolate; display: flex; align-items: flex-end; min-height: 480px; border-radius: 14px; overflow: hidden; color: #fff;
  background: radial-gradient(110% 90% at 85% 0%, hsl(var(--h) 70% 36% / .9), transparent 65%), linear-gradient(165deg, hsl(var(--h) 45% 16%), #141414);
  animation: hero-in .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes hero-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.hero::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, rgb(20 20 20 / .92) 0%, rgb(20 20 20 / .6) 42%, transparent 75%), linear-gradient(0deg, #141414 0%, transparent 45%); }
.hero-bg { position: absolute; inset: 0; z-index: 0; }
.hero-bg img { position: absolute; right: 0; top: 0; height: 100%; width: min(56%, 480px); max-width: none; object-fit: cover; object-position: center top;
  -webkit-mask-image: linear-gradient(270deg, #000 55%, transparent); mask-image: linear-gradient(270deg, #000 55%, transparent); }
.hero-in { position: relative; z-index: 2; padding: 40px; max-width: 700px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero h2 { margin: 0; font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: clamp(38px, 7vw, 68px); line-height: .95; text-wrap: balance; overflow-wrap: anywhere; text-shadow: 0 2px 18px rgb(0 0 0 / .45); }
.hero h2:focus { outline: none; }
.hero .ck { align-self: flex-start; font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; background: rgb(0 0 0 / .5); border-radius: 4px; padding: 3px 10px; }
.hero-seen { position: absolute; z-index: 3; top: 16px; left: 16px; background: #52D6C0; color: #06241F; font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 12px; border-radius: 4px; box-shadow: 0 2px 12px rgb(0 0 0 / .4); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { border-radius: 4px; padding: 3px 10px; font-size: 14px; color: #e5e5e5; background: rgb(255 255 255 / .14); }
.pill.rate { color: var(--accent); background: rgb(0 0 0 / .45); font-weight: 700; }
.syn { margin: 0; max-width: 60ch; font-size: 17px; text-shadow: 0 1px 10px rgb(0 0 0 / .5); }
.why { margin: 0; color: #d0d0d0; font-size: 14px; }
.note { margin: 0; font-size: 14px; color: var(--accent-text); background: rgb(0 0 0 / .45); border-radius: 8px; padding: 8px 12px; }
.where { margin: 0; font-size: 14px; color: #d0d0d0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.hero.spin .ct { opacity: .9; }

/* righe orizzontali e card */
.rs { display: flex; flex-direction: column; min-width: 0; }
.rh { margin: 0 0 6px; font-size: 20px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; }
.rh .n { color: var(--muted); font-size: 14px; font-weight: 500; }
.rail { display: flex; gap: 12px; overflow-x: auto; padding: 8px 2px 14px; scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: var(--line) transparent; overscroll-behavior-x: contain; }
.card { all: unset; box-sizing: border-box; cursor: pointer; flex: 0 0 auto; width: 150px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 6px; }
.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.lc { cursor: default; }
.cv { --h: 220; position: relative; display: flex; align-items: flex-end; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; padding: 10px; color: #fff; transition: transform .2s;
  background: radial-gradient(120% 70% at 15% 5%, hsl(var(--h) 80% 48% / .85), transparent 62%), linear-gradient(165deg, hsl(var(--h) 55% 24%), hsl(calc(var(--h) + 45) 60% 9%)); }
.cv img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; max-width: none; object-fit: cover; }
.cvt { position: relative; z-index: 0; font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 24px; line-height: .95; overflow-wrap: anywhere; text-shadow: 0 2px 14px rgb(0 0 0 / .4); }
.badge-seen, .badge-tv { position: absolute; z-index: 2; left: 6px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-radius: 3px; padding: 2px 7px; }
.badge-seen { top: 6px; background: #52D6C0; color: #06241F; }
.badge-tv { bottom: 6px; background: rgb(0 0 0 / .6); color: #fff; }
.cm { font-size: 13px; color: var(--muted); }
@media (hover: hover) { .card:hover .cv { transform: scale(1.05); } }
.thumbs-s { display: flex; gap: 8px; }
.th { all: unset; cursor: pointer; display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 8px; background: var(--surface-2); color: var(--muted); box-sizing: border-box; }
.th.down svg { transform: rotate(180deg); }
.th[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.th:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ca { display: flex; flex-direction: column; gap: 0; }
.lk { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--accent-text); font-size: 14px; text-decoration: underline; }
.lk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.empty { color: var(--muted); font-size: 14px; padding: 4px 0 8px; margin: 0; max-width: 60ch; }
.lists { display: flex; flex-direction: column; gap: 14px; }

/* valutazione dopo la visione */
.ratebox { background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.ratebox[hidden] { display: none; }
.ratebox p { margin: 0; }
.ratebox .rt { margin: 0; font-size: 22px; }
.ratebox .rt small { color: var(--muted); font-weight: 400; }
.ratebox .rq { font-weight: 700; }
.thumbs { display: flex; gap: 10px; }
.thumb { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-weight: 700; font-size: 16px; cursor: pointer; }
.thumb.down svg { transform: rotate(180deg); }
.thumb:hover, .thumb:focus-visible { border-color: var(--accent); }
.thumb[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.summary .pill { color: var(--fg); background: var(--surface-2); }

/* filtri e ricerca */
details { background: var(--surface); border-radius: 12px; padding: 4px 18px; min-width: 0; }
summary { cursor: pointer; padding: 14px 0; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; min-height: 48px; align-items: center; }
summary .n { color: var(--muted); font-weight: 500; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.li .t { min-width: 0; overflow-wrap: anywhere; }
.li .t small { color: var(--muted); }
.filters { margin: 0; }
.filters summary .n { font-size: 13px; text-align: right; }
.fbody { display: flex; flex-direction: column; gap: 18px; padding: 2px 0 16px; }
.slider { display: flex; flex-direction: column; gap: 4px; }
.slider label { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.slider output { color: var(--accent-text); font-variant-numeric: tabular-nums; }
.slider input[type="range"] { width: 100%; height: 40px; margin: 0; accent-color: var(--accent); touch-action: pan-y; }
.fgroup { display: flex; flex-direction: column; gap: 10px; }
.fhead { font-weight: 600; }
.chips.sm .chip { min-height: 42px; padding: 8px 14px; font-size: 14px; }
.fnote { margin: 0; font-size: 13px; color: var(--muted); }
.fbody .link { padding: 4px 0; }
.sinput { width: 100%; min-height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); padding: 10px 14px; font: inherit; font-size: 16px; }
.sinput::placeholder { color: var(--muted); }
.sr { padding: 12px 0; }
.sr .t small { white-space: nowrap; }
.sr .chips { gap: 8px; }
.li.sr button.tl { all: unset; cursor: pointer; font: inherit; font-weight: 700; color: var(--fg); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.li.sr button.tl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.li.sr button.chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); text-decoration: none; padding: 8px 14px; font-size: 14px; border-radius: 999px; min-height: 42px; }
.li.sr button.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }

footer { color: var(--muted); font-size: 13px; line-height: 1.5; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); border-radius: 999px; padding: 10px 20px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; width: max-content; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (hover: none) {
  .chip:hover, .btn:hover { border-color: var(--line); }
  .btn:hover { background: rgb(109 109 110 / .55); }
  .btn.primary:hover { background: var(--accent); filter: none; }
  .tab:not([aria-selected="true"]):hover { background: transparent; }
  .kind button:hover { color: var(--muted); }
  .kind button[aria-pressed="true"]:hover { color: var(--fg); }
}

@media (max-width: 720px) {
  body { padding-block: 0 calc(100px + env(safe-area-inset-bottom, 0px)); }
  .app { gap: 16px; }
  .top { padding: 12px 0 8px; gap: 12px; }
  h1 { font-size: 24px; }
  .brand svg { width: 28px; height: 28px; }
  .src { font-size: 12px; padding: 3px 10px; }
  .kind { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: grid; grid-template-columns: 1fr 1fr; gap: 0; background: #0f0f0f; border-top: 1px solid var(--line);
    padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-shadow: 0 -10px 28px rgb(0 0 0 / .4); }
  .kind button { flex-direction: column; gap: 2px; min-height: 56px; font-size: 13px; border-bottom: 0; border-radius: 8px; }
  .kind button svg { display: block; }
  .kind button[aria-pressed="true"] { color: var(--accent-text); box-shadow: inset 0 3px 0 var(--accent); }
  .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; }
  .stage { min-height: 0; }
  .panel { padding: 22px 16px; gap: 18px; }
  .chips.stack { flex-direction: column; }
  .chips.stack .chip { width: 100%; text-align: left; border-radius: 10px; min-height: 54px; padding: 12px 16px; font-size: 16px; }
  .chip { min-height: 48px; }
  .btn.big { align-self: stretch; }
  .hero { min-height: 440px; }
  .hero::before { background: linear-gradient(0deg, #141414 0%, rgb(20 20 20 / .85) 45%, transparent 80%); }
  .hero-bg img { width: 100%; height: 72%; -webkit-mask-image: linear-gradient(180deg, #000 50%, transparent); mask-image: linear-gradient(180deg, #000 50%, transparent); }
  .hero.has-poster { min-height: 640px; }
  .hero-in { padding: 20px 16px; gap: 12px; }
  .hero.has-poster .hero-in { padding-top: 260px; }
  .syn { font-size: 16px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions > .btn { min-height: 48px; padding: 10px 6px; font-size: 14px; }
  .actions > .btn:first-child, .actions > .btn:last-child { grid-column: 1 / -1; }
  .actions > .btn:first-child { min-height: 52px; font-size: 16px; }
  .hero .row { flex-direction: column; align-items: stretch; }
  .hero .row .btn { width: 100%; min-height: 52px; }
  .hero .row .link { align-self: center; }
  .facts { gap: 6px; }
  .card { width: 128px; }
  .cvt { font-size: 20px; }
  .toast { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .hero { animation: none; }
  .cv, .card:hover .cv { transition: none; transform: none; }
  .prog .bar i, .toast { transition: none; }
}
</style>


</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="3" y="6" width="28" height="22" rx="4" stroke="currentColor" stroke-width="2.4"/><path d="M3 12h28M3 22h28M10 6v6M17 6v6M24 6v6M10 22v6M17 22v6M24 22v6" stroke="currentColor" stroke-width="2"/></svg>
      <h1>Che Film Stasera</h1>
    </div>

async function showNext(withSpin) {

  const kind = S.kind;
  try {
    if (withSpin && !reduceMotion() && S.queue.length > 1) {
      const names = Engine.shuffle(S.queue).slice(0, 8);
      $('stage').innerHTML = '<article class="hero spin" style="--h:' + hueFor(names[0]) + '"><div class="hero-in"><h2 class="ct">' + esc(names[0].t) + '</h2><p class="syn">Sto pescando… un attimo, sfoglio il catalogo.</p></div></article>';
      const ct = $('stage').querySelector('.ct');

    }
    const batch = [];
    while (batch.length < BATCH && S.qi < S.queue.length) {
      const part = S.queue.slice(S.qi, S.qi + (BATCH - batch.length));
      S.qi += part.length;
      if (SRC[kind] === 'tmdb') await Promise.all(part.map(c => Engine.hydrate(c, (u) => fetch(u), TMDB_KEY)));
      part.forEach(c => { if (!(S.mode === 'guide' && S.ansUsed && !Engine.fits(c, S.ansUsed))) batch.push(c); });
    }
    if (kind !== S.kind) return; // l'utente ha cambiato sezione nel frattempo
    const pick = batch[0] || null;

    if (!cands.length) { S.tasteMsg = 'Non trovo titoli nuovi con i filtri attuali: prova ad abbassare il voto minimo.'; return render(); }
    S.prof = Engine.tasteProfile(usable, cands);
    S.queue = Engine.tasteRank(cands, S.prof);
    S.qi = 0; S.relaxed = []; S.ansUsed = null; S.empty = false; S.done = false;
    go = true;
  } finally { TB = false; }
  if (go) return showNext(false);
}
function reasonsFor(f) {
  if (S.mode === 'guide') return Engine.reasons(f, S.ansUsed || S.ans, S.relaxed);
  if (S.mode === 'taste' && S.prof) return Engine.tasteWhy(f, S.prof);
  return [];
}
// Altre proposte: riga orizzontale di card sotto il titolo in evidenza.
function altsHTML() {
  if (!S.cur || S.batch.indexOf(S.cur) === -1 || S.batch.length < 2) return '';
  const rest = S.batch.filter(f => f !== S.cur);
  return '<section class="rs alts" aria-label="Altre proposte"><h3 class="rh">Oppure scegli tra le altre ' + rest.length + ' proposte</h3><div class="rail">' + rest.map(f =>
    '<button class="card" data-act="pickalt" data-id="' + esc(f.id) + '" aria-label="' + esc(f.t) + '">' + cardCover(f) + '<span class="cm">' + esc(metaLine(f)) + '</span></button>'
  ).join('') + '</div></section>';
}
function tasteHTML() {
  const tv = isTv(), mine = seenItems(S.kind), usable = mine.filter(x => x.g && x.g.length);
  const c = {};
  usable.forEach(x => x.g.forEach(g => { c[g] = (c[g] || 0) + 1; }));
  const top = Object.keys(c).sort((a, b) => c[b] - c[a]).slice(0, 4);
  return '<div class="panel"><h2 class="lead">Partiamo da ciò che hai già ' + 'visto' + '</h2>' +
    '<p class="sub">Guardo i generi e le atmosfere ricorrenti tra ' + (tv ? 'le serie' : 'i film') + ' che hai segnato come già ' + (tv ? 'viste' : 'visti') + ' e ti propongo 5 titoli simili che non conosci ancora. Ne hai segnat' + (tv ? 'e ' : 'i ') + mine.length + '.</p>' +
    (top.length ? '<div class="summary"><span class="sub">Generi ricorrenti:</span>' + top.map(g => '<span class="pill">' + esc(g) + ' · ' + c[g] + '</span>').join('') + '</div>' : '') +
    (S.tasteMsg ? '<p class="note">' + esc(S.tasteMsg) + '</p>' : (mine.some(x => x.v) ? '<p class="sub">Tengo conto dei tuoi pollici: ' + mine.filter(x => x.v === 1).length + ' su, ' + mine.filter(x => x.v === -1).length + ' giù. Quelli senza voto contano la metà.</p>' : '<p class="sub">Non hai ancora valutato nulla: conto tutto ciò che hai visto allo stesso modo. Con il pollice su/giù (in «Già visti») i suggerimenti migliorano.</p>')) +
    '<button class="btn primary big" data-act="taste">Suggeriscimi 5 ' + (tv ? 'serie' : 'film') + '</button></div>';
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'kind') return setKind(el.dataset.kind);
  if (act === 'mode') return setMode(el.dataset.mode);
  if (act === 'surprise') { if (S.loading) return; const kd = S.kind; await ensurePool(); if (kd !== S.kind) return render(); buildQueue(); if (S.empty) { render(); return; } return showNext(true); }
  if (act === 'openfilters') { const f = $('filters'); f.open = true; try { f.scrollIntoView({ block: 'center' }); } catch (e2) { /* ignora */ } return; }
  if (act === 'taste') return buildTaste();
  if (act === 'pick' && S.cur) {
    if (inList(PICK, S.cur.id)) { dropPick(S.cur.id); toast('Tolto da "Li stai guardando"'); }
    else {
      const e = metaOf(S.cur); e.at = Date.now();
      PICK.unshift(e); store.set('cfs_pick', PICK);
      WATCH = WATCH.filter(x => x.id !== S.cur.id); store.set('cfs_watch', WATCH);
      toast('Buona visione! Alla prossima apertura ti chiedo com\'è andata');
    }
    return render();
  }
  if (act === 'prate' || act === 'pskip' || act === 'pnot') {
    const f = PICK.filter(x => x.id === el.dataset.id)[0];
    if (!f) return renderRate();
    if (act === 'prate') { setRating(f, parseInt(el.dataset.v, 10)); toast(el.dataset.v === '1' ? 'Segnato: ti è piaciuto' : 'Segnato: non ti è piaciuto'); }
    else if (act === 'pskip') { setRating(f, 0); toast('Va bene, salto la valutazione'); }
    else { dropPick(f.id); addTo(WATCH, f); store.set('cfs_watch', WATCH); toast('Rimesso in "Da vedere"'); }
    renderRate(); return render();
  }
  if (act === 'rate') {
    const id = el.dataset.id, v = parseInt(el.dataset.v, 10), cur = SEEN.filter(x => x.id === id)[0];
    if (!cur) return;
    setRating(cur, cur.v === v ? 0 : v);
    return render();
  }
  if (act === 'pickalt') {
    const f = S.batch.filter(x => x.id === el.dataset.id)[0];
    if (!f) return;
    S.cur = f; S.reasons = reasonsFor(f); render();
    try { $('stage').scrollIntoView({ block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth' }); } catch (e4) { /* ignora */ }
    return focusResult();
  }
  if (act === 'open') return openResult(parseInt(el.dataset.i, 10));
  if (act === 'sw' || act === 'ss') return searchToggle(act === 'sw' ? 'watch' : 'seen', parseInt(el.dataset.i, 10));
  if (act === 'freset') { CFG = { minRating: CFG_DEFAULT.minRating, yearsBack: CFG_DEFAULT.yearsBack, providers: [] }; saveCfg(); return renderFilters(); }
  if (act === 'prov') {
    const v = el.dataset.v, i = CFG.providers.indexOf(v);
    if (i === -1) CFG.providers.push(v); else CFG.providers.splice(i, 1);
    el.setAttribute('aria-pressed', i === -1); saveCfg();
    $('fsum').textContent = filtersSummary();
    return;
  }
  if (act === 'another') { if (!S.queue.length) { buildQueue(); if (S.empty) return render(); } return showNext(S.mode === 'surprise'); }
  if (act === 'opt') {
    const step = steps()[S.step]; const v = el.dataset.v;
    S.ans[step.key] = v === '' ? null : (step.key === 'co' || step.key === 'mood' ? v : (parseInt(v, 10) || null));
    S.step = Math.min(S.step + 1, steps().length - 1);
    return render();
  }
  if (act === 'genre') {
    const g = el.dataset.v, i = S.ans.genres.indexOf(g);
    if (i === -1) S.ans.genres.push(g); else S.ans.genres.splice(i, 1);
    el.setAttribute('aria-pressed', i === -1);
    return;
  }
  if (act === 'back') { S.step = Math.max(0, S.step - 1); return render(); }
  if (act === 'find') { if (S.loading) return; const kd = S.kind; await ensurePool(); if (S.ans.mood === 'cervellotico') await ensureCv(); if (kd !== S.kind) return render(); buildQueue(); if (S.empty) { render(); return; } return showNext(false); }
  if (act === 'edit') { S.cur = null; S.done = false; S.empty = false; S.step = 0; return render(); }
  if (act === 'watch' && S.cur) {
    if (inList(WATCH, S.cur.id)) { WATCH = WATCH.filter(x => x.id !== S.cur.id); toast('Tolto dalla lista'); }
    else { addTo(WATCH, S.cur); toast('Aggiunto a "Da vedere"'); }
    store.set('cfs_watch', WATCH); return render();
  }
  if (act === 'seen' && S.cur) {
    const tv = S.cur.kind === 'tv';
    if (inList(SEEN, S.cur.id)) {
      SEEN = SEEN.filter(x => x.id !== S.cur.id); store.set('cfs_seen', SEEN);
      toast(tv ? 'Tolta dai già visti' : 'Tolto dai già visti');
    } else {
      addTo(SEEN, S.cur); store.set('cfs_seen', SEEN); dropPick(S.cur.id);
      WATCH = WATCH.filter(x => x.id !== S.cur.id); store.set('cfs_watch', WATCH);
      toast(tv ? 'Segnata come vista' : 'Segnato come visto');
    }
    return render();
  }
  if (act === 'share' && S.cur) {
    const txt = Engine.shareText(S.cur);
    try { await navigator.clipboard.writeText(txt); toast('Testo copiato'); }
    catch (err) {
      const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      ta.remove(); toast(ok ? 'Testo copiato' : 'Copia non riuscita: seleziona il titolo e condividilo a mano');
    }
    return;
  }
  if (act === 'rm') {
    const id = el.dataset.id;
    if (el.dataset.kind === 'watch') { WATCH = WATCH.filter(x => x.id !== id); store.set('cfs_watch', WATCH); }
    else if (el.dataset.kind === 'pick') { dropPick(id); renderRate(); }
    else { SEEN = SEEN.filter(x => x.id !== id); store.set('cfs_seen', SEEN); S.empty = false; }
    return render();
  }
});

function readSlider(el, commit) {
  const v = parseFloat(el.value);
  if (el.dataset.f === 'minRating') { CFG.minRating = Math.round(v * 10) / 10; $('o-rate').textContent = fmtVote(CFG.minRating); }
  else { CFG.yearsBack = Math.round(v); $('o-years').textContent = CFG.yearsBack + (CFG.yearsBack === 1 ? ' anno' : ' anni'); }
  $('fsum').textContent = filtersSummary();
  if (commit) saveCfg();
}
// ---------- Ricerca per titolo (una per sezione: Film e Serie TV) ----------
const SRCH = { n: { movie: 0, tv: 0 }, timer: null, by: { movie: { q: '', res: [], note: '' }, tv: { q: '', res: [], note: '' } } };
function syncSearch() {
  const tv = isTv(), st = SRCH.by[S.kind];
  const sum = $('search').querySelector('summary');
  sum.firstChild.textContent = tv ? 'Cerca una serie TV' : 'Cerca un film';
  sum.querySelector('.n').textContent = tv ? 'solo serie' : 'solo film';
  const q = $('q');
  q.placeholder = tv ? 'Es. Dark, Breaking Bad, The Bear…' : 'Es. Inception, Parasite, Dune…';
  q.setAttribute('aria-label', tv ? 'Cerca una serie TV' : 'Cerca un film');
  if (q.value !== st.q) q.value = st.q;
  renderSearch();
}
function renderSearch() {
  const st = SRCH.by[S.kind];
  $('snote').textContent = st.note;
  $('sres').innerHTML = st.res.map((f, i) => {
    const w = inList(WATCH, f.id), sn = inList(SEEN, f.id), tv = f.kind === 'tv';
    return '<div class="li sr"><span class="t"><button class="tl" data-act="open" data-i="' + i + '" aria-label="Apri la scheda: ' + esc(f.t) + '">' + esc(f.t) + '</button>' + (f.y ? ' <small>(' + f.y + ')</small>' : '') + (f.r ? ' <small>★ ' + fmtVote(f.r) + '</small>' : '') + '</span>' +
      '<span class="chips sm"><button class="chip" data-act="sw" data-i="' + i + '" aria-pressed="' + w + '">' + (w ? 'Nella lista' : 'Da vedere') + '</button>' +
      '<button class="chip" data-act="ss" data-i="' + i + '" aria-pressed="' + sn + '">' + (sn ? (tv ? 'Vista' : 'Visto') : (tv ? 'Già vista' : 'Già visto')) + '</button></span></div>';
  }).join('');
}
async function doSearch(query, kind) {
  const my = ++SRCH.n[kind];
  const st = SRCH.by[kind];
  const qy = query.trim();
  const show = () => { if (S.kind === kind) renderSearch(); };
  if (qy.length < 2) { st.res = []; st.note = qy ? 'Scrivi almeno 2 lettere.' : ''; show(); return; }
  st.note = 'Cerco…'; show();
  let res = null, live = false;
  if (TMDB_KEY && isLive(kind)) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 6000);
    try { res = await Engine.searchLive((u) => fetch(u, { signal: ctl.signal }), TMDB_KEY, qy, kind); live = true; } catch (e) { res = null; }
    clearTimeout(timer);
  }
  if (my !== SRCH.n[kind]) return;
  const tv = kind === 'tv';
  if (!res) res = Engine.searchLocal(qy, kind);
  const small = 'catalogo incorporato (' + (tv ? Engine.CATALOG_TV.length + Engine.CULT_TV.length + ' serie' : Engine.CATALOG.length + Engine.CULT_MOVIES.length + ' film') + ')';
  st.res = res;
  st.note = res.length
    ? (live ? res.length + ' risultati da TMDB.' : 'Cerco nel ' + small + ': con i dati live si cerca su tutto TMDB.')
    : 'Nessun risultato per "' + qy + '".' + (live ? '' : ' Cerco solo nel ' + small + ': con i dati live si cerca su tutto TMDB.');
  show();
}
async function openResult(i) {
  const kd = S.kind, f = SRCH.by[kd].res[i];
  if (!f || S.busy) return;
  S.busy = true;
  try { if (SRC[kd] === 'tmdb' && f.tmdb) await Engine.hydrate(f, (u) => fetch(u), TMDB_KEY); } finally { S.busy = false; }
  if (kd !== S.kind) return;
  S.cur = f; S.batch = []; S.done = false; S.empty = false; S.reasons = [];
  render();
  try { $('stage').scrollIntoView({ block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth' }); } catch (e3) { /* ignora */ }
  focusResult();
}
function searchToggle(kind, i) {
  const f = SRCH.by[S.kind].res[i];
  if (!f) return;
  const tv = f.kind === 'tv';
  if (kind === 'watch') {
    if (inList(WATCH, f.id)) { WATCH = WATCH.filter(x => x.id !== f.id); toast('Tolto dalla lista'); }
    else { addTo(WATCH, f); toast('Aggiunto a "Da vedere"'); }
    store.set('cfs_watch', WATCH);
  } else if (inList(SEEN, f.id)) {
    SEEN = SEEN.filter(x => x.id !== f.id); store.set('cfs_seen', SEEN); toast(tv ? 'Tolta dai già visti' : 'Tolto dai già visti');
  } else {
    addTo(SEEN, f); store.set('cfs_seen', SEEN); dropPick(f.id);
    WATCH = WATCH.filter(x => x.id !== f.id); store.set('cfs_watch', WATCH);
    toast(tv ? 'Segnata come vista' : 'Segnato come visto');
  }
  renderSearch(); renderLists();
  if (S.cur && S.cur.id === f.id) render();
}
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { clearTimeout(SRCH.timer); const v = e.target.value, k = S.kind; SRCH.by[k].q = v; SRCH.timer = setTimeout(() => doSearch(v, k), 350); return; }
  if (e.target.dataset && e.target.dataset.f) readSlider(e.target, false);
});
document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.f) readSlider(e.target, true); });

// ---------- Avvio ----------
render();
renderRate();
renderFilters();
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderRate(); });
syncSearch();
['movie', 'tv'].forEach(async function (kind) {
  if (!TMDB_KEY) return;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000);
  const f = (u) => fetch(u, { signal: ctl.signal });
  try {
    let prov = [];
    try { prov = await Engine.loadProviders(f, TMDB_KEY, kind); } catch (e) { /* senza filtro piattaforme */ }
    PROV[kind] = prov;
    const ids = providerIds(kind);
    const p = await Engine.loadLive(f, TMDB_KEY, new Date(), kind, liveOpts(ids));
    if (p.length >= (ids.length ? 1 : 30)) {
      POOLS[kind] = p; SRC[kind] = 'tmdb'; LIVE_KEY[kind] = liveKey(kind, ids);
      if (S.kind === kind) {
        renderFilters();
        if (!S.busy && !S.loading && !S.cur && !S.queue.length && S.step === 0) render(); else renderFoot();
      }
      backfillPosters(kind);
    }
  } catch (e) { /* resta il catalogo incorporato */ }
  clearTimeout(timer);
});
})();
</script>
